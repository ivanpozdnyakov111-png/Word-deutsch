Правила: у существительных добавь артикль der/die/das (по буквам m/f/n или по знаниям) и множественное число после запятой: "der Tisch, -e|стол", "die Frage, -n|вопрос", "das Kind, Kinder|ребёнок"; знак «=» в учебнике означает «-» (=e → -e), «—» означает, что множественного числа нет. Глаголы — в инфинитиве, с управлением, если оно указано: "fragen (A)|спрашивать". Пропускай заголовки, номера, примеры предложений. Исправь явные ошибки распознавания. Без повторов.`;
function shrink(f,m=1800){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85)};im.onerror=()=>no(new Error('img'));im.src=u})}
